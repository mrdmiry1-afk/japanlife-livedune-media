name: Decode media
on:
  push:
    paths:
      - 'media/*.b64'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG files
        run: |
          for source in media/*.b64; do
            [ -f "$source" ] || continue
            target="${source%.b64}"
            base64 --decode "$source" > "$target"
          done
      - name: Commit decoded media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/*.jpg media/*.jpeg 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Decode LiveDune media"
          git push
